[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyflowviz"
version = "1.0.0"
description = "Step through Python code in your browser: call stack, variables, heap objects and a live flow graph."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
# Deliberately empty: setuptools otherwise emits `Dynamic: license-file`, which
# PyPI's metadata validator rejects with an opaque 400. The LICENSE file is
# still shipped in the sdist and the repository.
license-files = []
authors = [{ name = "Ankit Rai", email = "raia85859@gmail.com" }]
keywords = ["visualizer", "debugger", "teaching", "tracer", "flowchart", "education", "control-flow"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Software Development :: Debuggers",
]
# Deliberately no runtime dependencies: standard library only.
dependencies = []

[project.scripts]
pyflowviz = "pyflowviz:main"

[project.urls]
Homepage = "https://github.com/2001-Ankit/pyflowviz"
Repository = "https://github.com/2001-Ankit/pyflowviz"
Issues = "https://github.com/2001-Ankit/pyflowviz/issues"

[tool.setuptools]
packages = ["pyflowviz"]

[tool.setuptools.package-data]
pyflowviz = ["static/*"]
